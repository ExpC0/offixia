# Memory settings tuned for a 7.7 GB machine.
#
# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which promises the
# JVM more memory than this laptop physically has. Gradle happily grew into it,
# the kernel OOM killer shot the daemon mid-build, and VSCode died alongside it
# because the daemon lived in the editor's process scope.
#
# 1.5 GB heap is comfortably enough to build this app. Metaspace started at
# 512m and R8 hit "OutOfMemoryError: Metaspace" once the google-services
# plugin was added, so it sits at 768m -- raised because a build actually
# failed, which is the only reason to raise it further.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m

# The Kotlin compiler forks its own JVM and otherwise inherits that same 8G
# default, so it needs capping separately or the fix above achieves nothing.
kotlin.daemon.jvmargs=-Xmx1024m

# Cap concurrent workers. Unbounded parallelism is what turns a slow build into
# a frozen desktop, since each worker is another JVM competing for the same RAM.
org.gradle.workers.max=2
org.gradle.parallel=false

# Reuse task outputs between builds. Costs disk, saves a lot of rebuild time.
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
